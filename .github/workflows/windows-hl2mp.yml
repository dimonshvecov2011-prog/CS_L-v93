name: Windows HL2MP build

on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build-hl2mp:
    name: Generate and build HL2MP (Release Win32)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Generate Visual Studio solution with VPC
        shell: cmd
        working-directory: mp/src
        run: |
          devtools\bin\vpc.exe /hl2mp +everything /define:VS2022 > ..\..\vpc-generation.log 2>&1
          if errorlevel 1 exit /b 1
          findstr /C:"<PlatformToolset>v143</PlatformToolset>" game\client\client_css93.vcxproj >> ..\..\vpc-generation.log
          if errorlevel 1 exit /b 1
          findstr /C:"<PlatformToolset>v143</PlatformToolset>" game\server\server_css93.vcxproj >> ..\..\vpc-generation.log
          if errorlevel 1 exit /b 1

      - name: Build Client (HL2MP) (Release Win32)
        shell: cmd
        run: |
          msbuild mp\src\game\client\client_hl2mp.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /v:minimal > build-release-win32.log 2>&1
          if errorlevel 1 exit /b 1

      - name: Build Server (HL2MP) (Release Win32)
        shell: cmd
        run: |
          msbuild mp\src\game\server\server_hl2mp.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /v:minimal >> build-release-win32.log 2>&1
          if errorlevel 1 exit /b 1

      - name: Build Client (CSS93) (Release Win32)
        shell: cmd
        run: |
          msbuild mp\src\game\client\client_css93.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /v:minimal >> build-release-win32.log 2>&1
          if errorlevel 1 exit /b 1

      - name: Build Server (CSS93) (Release Win32)
        shell: cmd
        run: |
          msbuild mp\src\game\server\server_css93.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /v:minimal >> build-release-win32.log 2>&1
          if errorlevel 1 exit /b 1

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-hl2mp-build-logs
          path: |
            vpc-generation.log
            build-release-win32.log
            mp/game/css93/bin/*.dll
          if-no-files-found: warn
