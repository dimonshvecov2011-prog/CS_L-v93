name: Build CS:L Launcher

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'csl-v*', 'v*' ]
    paths:
      - 'CSL/**'
      - '.github/workflows/build-csl.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'CSL/**'
      - '.github/workflows/build-csl.yml'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PUBLISH_DIR: CSL/artifacts/publish/win-x64

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate CS:L version declarations
        shell: pwsh
        run: |
          [xml]$project = Get-Content ".\CSL\src\CssLauncher.App\CssLauncher.App.csproj" -Raw
          $projectVersion = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          $windowText = Get-Content ".\CSL\src\CssLauncher.App\MainWindow.xaml.cs" -Raw
          $windowMatch = [regex]::Match($windowText, 'CurrentVersion\s*=\s*"([^"]+)"')
          if (-not $windowMatch.Success) { throw "Не удалось прочитать версию из MainWindow.xaml.cs." }
          $windowVersion = $windowMatch.Groups[1].Value
          $xamlText = Get-Content ".\CSL\src\CssLauncher.App\MainWindow.xaml" -Raw
          $xamlTitleMatch = [regex]::Match($xamlText, 'Title="CS:L ([^"]+)"')
          $xamlSidebarMatch = [regex]::Match($xamlText, 'Text="CS:L v([^"]+)"')
          $setupText = Get-Content ".\CSL\installer\CSL-Setup.iss" -Raw
          $setupMatch = [regex]::Match($setupText, '#define MyAppVersion "([^"]+)"')
          $feed = Get-Content ".\CSL\config\launcher-update.json" -Raw | ConvertFrom-Json
          if (-not $setupMatch.Success) { throw "Не удалось прочитать версию Inno Setup." }
          $setupVersion = $setupMatch.Groups[1].Value
          if (-not $xamlTitleMatch.Success -or -not $xamlSidebarMatch.Success -or
              $projectVersion -ne $windowVersion -or $projectVersion -ne $setupVersion -or
              $projectVersion -ne $xamlTitleMatch.Groups[1].Value -or
              $projectVersion -ne $xamlSidebarMatch.Groups[1].Value -or $feed.version -ne $projectVersion) {
            throw "Несогласованные версии csproj/MainWindow/XAML/installer/feed: $projectVersion / $windowVersion / $($xamlTitleMatch.Groups[1].Value) / $($xamlSidebarMatch.Groups[1].Value) / $setupVersion / $($feed.version)."
          }
          if ([string]::IsNullOrWhiteSpace($feed.downloadUrl) -and (-not [string]::IsNullOrWhiteSpace($feed.sha256) -or $feed.size -ne 0)) {
            throw "Отключённый update feed должен иметь пустой SHA-256 и нулевой размер."
          }

      - name: Validate release tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^(csl-)?v', ''
          [xml]$project = Get-Content ".\CSL\src\CssLauncher.App\CssLauncher.App.csproj" -Raw
          $projectVersion = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          $setupText = Get-Content ".\CSL\installer\CSL-Setup.iss" -Raw
          $setupMatch = [regex]::Match($setupText, '#define MyAppVersion "([^"]+)"')
          if (-not $setupMatch.Success) { throw "Не удалось прочитать версию Inno Setup." }
          $setupVersion = $setupMatch.Groups[1].Value
          if ($tagVersion -ne $projectVersion -or $tagVersion -ne $setupVersion) {
            throw "Версия тега ($tagVersion) не совпадает с проектом ($projectVersion) и установщиком ($setupVersion)."
          }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\CSL\CssLauncher.sln -r win-x64

      - name: Build
        run: dotnet build .\CSL\CssLauncher.sln -c Release --no-restore

      - name: Test
        run: dotnet test .\CSL\tests\CssLauncher.Tests\CssLauncher.Tests.csproj -c Release --no-build --no-restore

      - name: Publish self-contained single-file app
        shell: pwsh
        run: |
          if (Test-Path $env:PUBLISH_DIR) { Remove-Item $env:PUBLISH_DIR -Recurse -Force }
          New-Item -ItemType Directory -Path $env:PUBLISH_DIR -Force | Out-Null
          dotnet publish .\CSL\src\CssLauncher.App\CssLauncher.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishTrimmed=false `
            -o $env:PUBLISH_DIR

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
          & $iscc ".\CSL\installer\CSL-Setup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload portable publish
        uses: actions/upload-artifact@v4
        with:
          name: CSL-win-x64-portable
          path: CSL/artifacts/publish/win-x64
          if-no-files-found: error
          retention-days: 30

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CSL-Windows-Installer
          path: CSL/artifacts/installer/*.exe
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/csl-v') || startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: CSL-Windows-Installer
          path: dist

      - name: Create GitHub release for CS:L tag
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.exe
