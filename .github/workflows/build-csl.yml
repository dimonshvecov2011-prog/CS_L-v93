name: Build CS:L Launcher

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'csl-v*' ]
    paths:
      - 'CSL/**'
      - '.github/workflows/build-csl.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'CSL/**'
      - '.github/workflows/build-csl.yml'

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PUBLISH_DIR: artifacts/publish/win-x64

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\CssLauncher.sln
        working-directory: CSL

      - name: Build
        run: dotnet build .\CssLauncher.sln -c Release --no-restore
        working-directory: CSL

      - name: Test
        run: dotnet test .\tests\CssLauncher.Tests\CssLauncher.Tests.csproj -c Release --no-build --no-restore
        working-directory: CSL

      - name: Publish self-contained single-file app
        shell: pwsh
        working-directory: CSL
        run: |
          if (Test-Path $env:PUBLISH_DIR) { Remove-Item $env:PUBLISH_DIR -Recurse -Force }
          New-Item -ItemType Directory -Path $env:PUBLISH_DIR -Force | Out-Null
          dotnet publish .\src\CssLauncher.App\CssLauncher.App.csproj `
            -c Release -r win-x64 --self-contained true --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishTrimmed=false `
            -o $env:PUBLISH_DIR

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
        working-directory: CSL

      - name: Build installer
        shell: pwsh
        working-directory: CSL
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
          & $iscc ".\installer\CSL-Setup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload portable publish
        uses: actions/upload-artifact@v4
        with:
          name: CSL-win-x64-portable
          path: CSL/artifacts/publish/win-x64
          if-no-files-found: error
          retention-days: 30

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CSL-Windows-Installer
          path: CSL/artifacts/installer/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release for CS:L tag
        if: startsWith(github.ref, 'refs/tags/csl-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: CSL/artifacts/installer/*.exe
